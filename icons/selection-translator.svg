<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>划词翻译</title>
  <desc>被高亮选中的字母 A、鼠标光标与写着「文」的释义气泡</desc>

  <!-- 底板：与应用「译」按钮同色的圆角方块 -->
  <rect width="128" height="128" rx="30" fill="#3584e4"/>
  <circle cx="12" cy="114" r="36" fill="#ffffff" opacity="0.06"/>
  <circle cx="118" cy="14" r="26" fill="#ffffff" opacity="0.06"/>

  <!-- 划词：黄色高亮条选中的字母 A -->
  <rect x="8" y="41" width="62" height="46" rx="23" fill="#ffd54a"/>
  <g fill="none" stroke="#1c71d8" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M39 49 L28 79"/>
    <path d="M39 49 L50 79"/>
    <path d="M33 67 L45 67"/>
  </g>

  <!-- 鼠标：划过待翻译的词 -->
  <g transform="translate(56 86) scale(1.3)">
    <path d="M0 0 L0 17 L4.4 13.3 L7.4 19.8 L11 18.2 L8 11.7 L13.6 11.5 Z"
          fill="#ffffff" stroke="#1c71d8" stroke-width="2.2" stroke-linejoin="round"/>
  </g>

  <!-- 释义气泡：鼠标旁弹出的译文「文」 -->
  <path d="M69 64 L74 56 L74 72 Z" fill="#ffffff"/>
  <rect x="74" y="33" width="46" height="50" rx="16" fill="#ffffff"/>
  <g fill="none" stroke="#3584e4" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M97 41 L97 46"/>
    <path d="M88 56 L106 56"/>
    <path d="M97 56 L90 76"/>
    <path d="M97 56 L104 76"/>
  </g>
</svg>
