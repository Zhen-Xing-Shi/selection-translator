<?xml version="1.0" encoding="UTF-8"?>
<!-- 划词翻译 selection-translator
     橙色圆角底 + 白色对称放大镜（镜片圆环 + 竖直手柄），镜片左上加一点高光。
     图形四周留白 8/144（约 5.5%），使它在应用列表里与其它图标视觉大小一致。 -->
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="-8 -8 144 144" role="img"
     aria-label="划词翻译">
  <title>划词翻译</title>

  <!-- 背景：橙色圆角方块 -->
  <rect width="128" height="128" rx="28" fill="#FF8A00"/>

  <!-- 放大镜：镜片 + 竖直手柄（手柄顶端藏在圆环笔画内） -->
  <g fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round">
    <circle cx="64" cy="44" r="27"/>
    <line x1="64" y1="71" x2="64" y2="111"/>
  </g>

  <!-- 镜片高光（左上 45°，与圆环内缘留 3.5px 空隙） -->
  <circle cx="54.8" cy="34.8" r="4.5" fill="#FFFFFF"/>
</svg>
